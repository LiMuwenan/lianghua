<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>量化交易平台</title>
  <link rel="stylesheet" href="/css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
</head>
<body>
  <header class="topbar">
    <h1>量化交易平台 <span class="ver">P0</span></h1>
    <nav class="tabs">
      <button class="tab active" data-page="datasets">数据管理</button>
      <button class="tab" data-page="strategies">策略/回测</button>
      <button class="tab" data-page="tasks">任务</button>
    </nav>
    <span class="running-hint" id="runningHint"></span>
  </header>

  <main class="container">
    <!-- 数据管理页 -->
    <section id="page-datasets" class="page">
      <div class="page-head">
        <h2>数据集覆盖情况</h2>
        <button class="btn" id="refreshDatasets">刷新扫描</button>
      </div>
      <div id="datasetChart" class="chart"></div>
      <div id="datasetCards" class="cards"></div>
    </section>

    <!-- 策略/回测页 -->
    <section id="page-strategies" class="page hidden">
      <div class="page-head">
        <h2>脚本 / 策略 / 回测</h2>
        <button class="btn" id="rescan">重新扫描登记</button>
      </div>
      <div id="strategyList" class="strategy-list"></div>
    </section>

    <!-- 任务页 -->
    <section id="page-tasks" class="page hidden">
      <div class="page-head">
        <h2>任务运行记录</h2>
        <button class="btn" id="refreshTasks">刷新</button>
      </div>
      <div id="taskTable"></div>
    </section>
  </main>

  <!-- 日志弹窗 -->
  <div id="logModal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-head">
        <h3>任务日志</h3>
        <span id="logTaskInfo"></span>
        <button class="btn close" id="closeLog">✕</button>
      </div>
      <pre id="logContent" class="log-content"></pre>
      <div class="modal-foot">
        <label><input type="checkbox" id="autoTail" checked /> 自动刷新</label>
        <button class="btn" id="refreshLog">刷新日志</button>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/datasets.js"></script>
  <script src="/js/strategies.js"></script>
  <script src="/js/tasks.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
