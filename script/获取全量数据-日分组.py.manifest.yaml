# 数据脚本登记：全量数据抓取（按日分组）
name: 全量数据抓取-日分组
kind: script
script: script/获取全量数据-日分组.py
params:
  start_date:
    default: "2005-01-01"
    type: date
    var: START_DATE
    desc: 起始日期
  end_date:
    default: ""
    type: date
    var: END_DATE
    desc: 空=今天
  fetch_daily:
    default: true
    type: bool
    var: FETCH_DAILY
    desc: True=抓取每日 / False=跳过抓取
outputs:
  - dataset: 每日
    pattern: 每日/*.csv
  - dataset: 合并
    pattern: 合并/*.csv