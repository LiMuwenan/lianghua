name: Build & Push Docker Image

on:
  push:
    branches: ["platform"]
    tags: ["v*"]
  workflow_dispatch:

env:
  # 优先 vars.DOCKERHUB_IMAGE（完整镜像名）；否则用 vars/secrets 中的用户名拼 lianghua
  IMAGE_NAME: ${{ vars.DOCKERHUB_IMAGE || format('{0}/lianghua', vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME) }}
  DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max