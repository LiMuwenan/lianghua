# 策略登记：C 真实回测（60日，含止损与成本）
name: C真实回测-60日
kind: backtest
script: strategy/strategy/C.py
params:
  ma_period:
    default: 60
    type: int
    var: MA_PERIOD
    desc: 均线周期
  slope_window:
    default: 20
    type: int
    var: SLOPE_WINDOW
    desc: 斜率窗口
  buffer:
    default: 0.01
    type: float
    var: BUFFER
    desc: 触线缓冲
  rev_window:
    default: 10
    type: int
    var: REV_WINDOW
    desc: 最大持仓交易日
  stop_loss:
    default: 0.95
    type: float
    var: STOP_LOSS
    desc: 止损线
  cost:
    default: 0.002
    type: float
    var: COST
    desc: 双边总成本
  entry_offset:
    default: 1
    type: int
    var: ENTRY_OFFSET
    desc: 信号后第几个交易日入场
data_dep: A股日K数据
output: outputs/C_回测_60日.xlsx