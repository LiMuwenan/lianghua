# 策略登记：MA60 触线反转回测（距离分档匹配基准）
name: MA60触线反转回测-匹配基准
kind: backtest
script: strategy/strategy/A.py
params:
  years:
    default: 10
    type: int
    var: YEARS
    desc: 回测年数
  buffer:
    default: 0.01
    type: float
    var: BUFFER
    desc: 触线缓冲带
  ma_periods:
    default: [5, 20, 60, 180]
    type: list[int]
    var: MA_PERIODS
    desc: 均线周期
data_dep: A股日K数据
output: outputs/A_结果.xlsx