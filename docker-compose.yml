services:
  lianghua:
    image: "${DOCKERHUB_USERNAME}/lianghua:${TAG:-latest}"
    container_name: lianghua
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - APP_CONFIG=/app/config/config.docker.yaml
    volumes:
      # 数据基目录（含 /data/market、/data/meta.db、/data/outputs、/data/raw）
      - "${DATA_DIR:-./data}:/data"
      # 如需覆盖镜像内置配置，取消下面一行注释，并确保宿主机文件真实存在
      # （文件不存在时 Docker 会创建同名目录，APP_CONFIG 读取会失败）
      # - "${CONFIG_FILE:-./config/config.docker.yaml}:/app/config/config.docker.yaml:ro"
    restart: unless-stopped